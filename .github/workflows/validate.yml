name: Validate plugin

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository contract
        run: python scripts/validate_repository.py
      - name: Test release validation
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Require version increases for skill changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/validate_skill_release.py --base "$BASE_SHA"
